<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to Maplet.net…</title>
  <link rel="canonical" href="https://maplet.net/">
  <meta http-equiv="refresh" content="0; url=https://maplet.net/">
  <meta name="robots" content="noindex, follow">
  <script>
    (function () {
      // Preserve ?data= (and any other query/hash) for deep links.
      var dest = "https://maplet.net/" + window.location.search + window.location.hash;
      // If this looks like a share payload, send it to /share.
      if (/[?&]data=/.test(window.location.search)) {
        dest = "https://maplet.net/share" + window.location.search + window.location.hash;
      }
      window.location.replace(dest);
    })();
  </script>
</head>
<body>
  <p>Maplet has moved to <a href="https://maplet.net/">maplet.net</a>. Redirecting you now…</p>
</body>
</html>
